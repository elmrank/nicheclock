# Wikidata class rules -> level-1 category (ids from categories.json).
#
# How an entity is classified (nicheclock/catalog/categories.py):
#   1. it has a "sport" statement (P641)                         -> sports
#   2. it is a human (P31 = Q5): the classes of its occupations   -> `occupation_rules` (nearest wins)
#   3. it is a taxon (P31 = Q16521): follow parent taxon (P171)   -> Animalia (Q729) = pets-animals, else science
#   4. otherwise: walk "instance of" (P31) / "subclass of" (P279) of the entity, then P279 upward, at most
#      `max_depth` steps, and take the rule whose class is NEAREST; ties go to the first category in `priority`
#   5. nothing matched                                            -> other
# `max_depth` on a rule: the very general classes (academic discipline, company, product...) only count when the
# entity is this close to them, otherwise half of Wikidata is "a company" or "a scientist".
# Rules are classes, never single topics: nobody lists topics by hand. Each category has between
# `min_rules` and `max_rules` entries (checked at build time and in tests) so no branch is seeded deeper
# than another; see check_symmetry in categories.py.
#
# Every QID was read against its English label on 2026-11-01 and still exists (`python -m nicheclock.catalog verify-map`);
# `python -m nicheclock.catalog map` prints this file as a table with the live labels.
version: 1
max_depth: 6
taxon_depth: 40
min_rules: 3
# Tie-break when two categories match at the same distance: specific before generic.
priority: [sports, games, entertainment, politics, law-government, health, science, climate, food-drink,
           autos-vehicles, technology, beauty-fashion, pets-animals, hobbies-leisure, jobs-education,
           travel-transportation, shopping, business-finance]
max_rules: 24

# P641 (sport) present -> category
property_rules:
  P641: sports

