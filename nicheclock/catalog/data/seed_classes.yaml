# Seed classes for the category-seeded pool (nicheclock/catalog/seeds.py).
#
# A category is filled from its OWN pages, not only from whatever is on a Wikipedia top list: for each class below,
# the direct instances (P31) with the most Wikipedia sitelinks are read from Wikidata, and their pageviews decide
# what rises and what is steady. Classes, never single topics; 5 or 6 per category (check_symmetry), so no branch
# is seeded deeper than another. "other" has none. Every QID was read against its English label on 2026-11-01.
version: 1
min_classes: 5
max_classes: 6
per_class_limit: 200            # instances kept per class (most sitelinks first)
min_sitelinks: 12
per_category_pool: 300          # members kept per category after merging its classes
